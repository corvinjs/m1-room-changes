    const params = new URLSearchParams(location.search);
    const selected = new Set((params.has("courses") ? params.get("courses") : DATA.courses.map(c => c.code).join(",")).split(",").filter(Boolean));
    const validGroups = new Set(["gr1", "gr2", "gr3", "gr4"]);
    const groupSelections = new Map();
    for (const entry of (params.get("groups") || "").split(",")) {
      const [code, group] = entry.split("%");
      if (DATA.courses.some(course => course.code === code) && validGroups.has(group)) groupSelections.set(code, group);
    }
    const courses = document.querySelector("#courses");
    const toggleCourses = document.querySelector("#toggle-courses");
    const events = document.querySelector("#events");
    document.querySelector("#generated").textContent = new Date(DATA.generatedAt).toLocaleString("fr-FR");

    function updateToggle() {
      const allSelected = DATA.courses.length > 0 && DATA.courses.every(course => selected.has(course.code));
      toggleCourses.textContent = allSelected ? "Tout désélectionner" : "Tout sélectionner";
      toggleCourses.setAttribute("aria-label", allSelected ? "Désélectionner tous les cours" : "Sélectionner tous les cours");
    }

    function sync() {
      const value = [...selected].filter(code => DATA.courses.some(c => c.code === code)).join(",");
      const next = new URL(location.href);
      next.searchParams.set("courses", value);
      const groups = [...groupSelections]
        .filter(([code, group]) => DATA.courses.some(course => course.code === code) && validGroups.has(group))
        .map(([code, group]) => `${code}%${group}`)
        .join(",");
      if (groups) next.searchParams.set("groups", groups);
      else next.searchParams.delete("groups");
      history.replaceState(null, "", next);
      updateToggle();
      updateGroupVisibility();
      render();
    }
    function updateGroupVisibility() {
      courses.querySelectorAll(".course-option").forEach(option => {
        const input = option.querySelector('input[type="checkbox"]');
        option.querySelector(".group-options").hidden = !input.checked;
      });
    }
    DATA.courses.forEach(course => {
      const option = document.createElement("div");
      option.className = "course-option";
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox"; input.value = course.code; input.checked = selected.has(course.code);
      input.addEventListener("change", () => input.checked ? selected.add(course.code) : selected.delete(course.code));
      input.addEventListener("change", sync);
      label.append(input, " ", course.name);
      const groupOptions = document.createElement("fieldset");
      groupOptions.className = "group-options";
      groupOptions.setAttribute("aria-label", `Groupe pour ${course.name}`);
      for (const group of ["all", ...validGroups]) {
        const groupLabel = document.createElement("label");
        const groupInput = document.createElement("input");
        groupInput.type = "radio";
        groupInput.name = `group-${course.code}`;
        groupInput.value = group;
        groupInput.checked = (groupSelections.get(course.code) || "all") === group;
        groupInput.addEventListener("change", () => {
          if (group === "all") groupSelections.delete(course.code);
          else groupSelections.set(course.code, group);
          sync();
        });
        groupLabel.append(groupInput, " ", group);
        groupOptions.append(groupLabel);
      }
      option.append(label, groupOptions);
      courses.append(option);
    });
    toggleCourses.addEventListener("click", () => {
      const allSelected = DATA.courses.length > 0 && DATA.courses.every(course => selected.has(course.code));
      if (allSelected) selected.clear();
      else DATA.courses.forEach(course => selected.add(course.code));
      courses.querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.checked = selected.has(input.value);
      });
      sync();
    });
    updateToggle();
    updateGroupVisibility();
    function formatDate(start, end) {
      const date = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(new Date(start));
      const time = new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" });
      return `${date}, ${time.format(new Date(start))} - ${time.format(new Date(end))}`;
    }
    function weekStart(value) {
      const date = new Date(value);
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() - (date.getDay() + 6) % 7);
      return date;
    }
    function formatWeek(value) {
      return "Semaine du " + new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(weekStart(value));
    }
    function render() {
      events.replaceChildren();
      const now = Date.now();
      const upcoming = DATA.events.filter(event => new Date(event.end).getTime() > now);
      const visible = upcoming.filter(event => {
        if (!selected.has(event.code)) return false;
        const group = groupSelections.get(event.code);
        return !group || event.session.toLowerCase().includes("cours") || new RegExp(`\\b${group}\\b`, "i").test(event.session);
      });
      if (!visible.length) { events.innerHTML = '<p class="empty">Aucun cours à venir pour cette sélection.</p>'; return; }
      let currentWeek = "";
      visible.forEach(event => {
        const week = weekStart(event.start).toISOString().slice(0, 10);
        if (week !== currentWeek) {
          const weekHeading = document.createElement("h2");
          weekHeading.className = "week-heading";
          weekHeading.textContent = formatWeek(event.start);
          events.append(weekHeading);
          currentWeek = week;
        }
        const article = document.createElement("article");
        const changed = event.note.startsWith("CHANGE") || event.note === "no room";
        article.className = "event " + (event.cancelled ? "cancelled" : changed ? "change" : event.opaque ? "" : "normal");
        let room = event.cancelled ? (event.usualRoom || "—") : (event.room || event.usualRoom || "—");
        if (!event.cancelled && event.note.startsWith("CHANGE")) room = event.room ? "calendrier: " + event.room + "\nprévu: " + event.usualRoom : "pas de salle (prévu: " + event.usualRoom + ")";
        const heading = document.createElement("div");
        const date = document.createElement("span");
        date.className = "event-date";
        date.textContent = formatDate(event.start, event.end);
        const course = DATA.courses.find(course => course.code === event.code);
        const courseElement = document.createElement("span");
        courseElement.className = "event-course";
        courseElement.textContent = course ? course.name : event.code;
        if (event.cancelled) {
          const cancelled = document.createElement("strong");
          cancelled.textContent = "Annulé:";
          heading.append(cancelled);
          heading.append(document.createElement("br"));
        }
        heading.append(date, document.createElement("br"), courseElement, event.session ? " · " : "", event.session);
        const roomElement = document.createElement("div");
        roomElement.className = "room";
        roomElement.textContent = room;
        article.append(heading, roomElement);
        events.append(article);
      });
    }
    render();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });
  </script>
