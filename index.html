    const params = new URLSearchParams(location.search);
    const selected = new Set((params.get("courses") || DATA.courses.map(c => c.code).join(",")).split(",").filter(Boolean));
    const courses = document.querySelector("#courses");
    const events = document.querySelector("#events");
    document.querySelector("#generated").textContent = new Date(DATA.generatedAt).toLocaleString("fr-FR");

    function sync() {
      const value = [...selected].filter(code => DATA.courses.some(c => c.code === code)).join(",");
      const next = new URL(location.href);
      if (value) next.searchParams.set("courses", value); else next.searchParams.delete("courses");
      history.replaceState(null, "", next);
      render();
    }
    DATA.courses.forEach(course => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox"; input.value = course.code; input.checked = selected.has(course.code);
      input.addEventListener("change", () => input.checked ? selected.add(course.code) : selected.delete(course.code));
      input.addEventListener("change", sync);
      label.append(input, " ", course.name);
      courses.append(label);
    });
    function formatDate(value) {
      return new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }).format(new Date(value));
    }
    function render() {
      events.replaceChildren();
      const visible = DATA.events.filter(event => selected.has(event.code));
      if (!visible.length) { events.innerHTML = '<p class="empty">Aucun cours à venir pour cette sélection.</p>'; return; }
      visible.forEach(event => {
        const article = document.createElement("article");
        const changed = event.note.startsWith("CHANGE") || event.note === "no room";
        article.className = "event " + (event.cancelled ? "cancelled" : changed ? "change" : event.opaque ? "" : "normal");
        const title = event.cancelled ? "Annulé: " : "";
        let room = event.cancelled ? "prévu: " + (event.usualRoom || "—") : (event.room || event.usualRoom || "—");
        if (!event.cancelled && event.note.startsWith("CHANGE")) room = event.room ? "calendrier: " + event.room + " (prévu: " + event.usualRoom + ")" : "pas de salle (prévu: " + event.usualRoom + ")";
        const heading = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = title + formatDate(event.start);
        heading.append(strong, " · ", event.session);
        const roomElement = document.createElement("div");
        roomElement.className = "room";
        roomElement.textContent = room;
        article.append(heading, roomElement);
        events.append(article);
      });
    }
    render();
